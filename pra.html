    <button 
  class="flex items-center gap-2 px-4 py-2 rounded-md bg-gray-800 text-white hover:bg-gray-700 transition"
>

  <span>Light Mode</span>
</button>

<button 
  class="flex items-center gap-2 px-4 py-2 rounded-md bg-gray-200 text-gray-800 hover:bg-gray-300 transition"

</button>

<i class="fas fa-moon"></i>  <!-- Dark Mode -->
<i class="fas fa-adjust"></i> <!-- Brightness adjust -->

<div class="relative inline-block text-left">

  </button>

  <div class="absolute right-0 mt-2 w-40 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 hidden group-hover:block">
    <div class="py-1">
      <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
      <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
